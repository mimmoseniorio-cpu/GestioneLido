name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # Un PostgreSQL vero, non un sostituto: i vincoli EXCLUDE e btree_gist
    # sono la garanzia centrale del progetto e vanno verificati su Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lido
          POSTGRES_PASSWORD: lido
          POSTGRES_DB: gestionelido_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://lido:lido@localhost:5432/gestionelido_test?schema=public
      DIRECT_DATABASE_URL: postgresql://lido:lido@localhost:5432/gestionelido_test?schema=public
      TEST_DATABASE_URL: postgresql://lido:lido@localhost:5432/gestionelido_test?schema=public

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm test

      # ── I nove criteri di docs/07, a ogni push ────────────────────────────
      #
      # «Semplice» per questo prodotto è una tabella di numeri, non un
      # aggettivo: prenotare costa al massimo quattro interazioni, uno
      # stagionale comunica un'assenza in tre tap. Verificarli a mano ogni
      # tanto vuol dire scoprire fra un mese che sono diventati sei.
      - name: Stabilimento dimostrativo
        run: npm run seed

      - name: Chromium per gli scenari
        run: npx playwright install --with-deps chromium

      - name: Compila e avvia
        run: |
          npm run build
          npm start &
          npx wait-on -t 60000 http://localhost:3000/login

      - name: Scenari end-to-end e conteggio delle interazioni
        run: npm run e2e

      # ── La copia di sicurezza deve restare ripristinabile ─────────────────
      #
      # Non basta che lo script giri: si controlla che dal dump tornino i tre
      # vincoli EXCLUDE, i trigger e btree_gist. Se si perdessero, il database
      # ripristinato accetterebbe di vendere due volte lo stesso ombrellone.
      # `pg_dump` e `psql` non sono garantiti sul runner, e devono essere della
      # stessa versione maggiore del server (16): un pg_dump più vecchio si
      # rifiuta di leggere un database più nuovo.
      - name: Strumenti di PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16

      - name: Copia di sicurezza e prova di ripristino
        env:
          URL_DB_PROVA: postgresql://lido:lido@localhost:5432/gestionelido_verifica
        run: |
          npm run backup
          npm run backup:verifica
