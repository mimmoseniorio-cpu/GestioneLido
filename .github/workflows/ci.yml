name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # Un PostgreSQL vero, non un sostituto: i vincoli EXCLUDE e btree_gist
    # sono la garanzia centrale del progetto e vanno verificati su Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lido
          POSTGRES_PASSWORD: lido
          POSTGRES_DB: gestionelido_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://lido:lido@localhost:5432/gestionelido_test?schema=public
      TEST_DATABASE_URL: postgresql://lido:lido@localhost:5432/gestionelido_test?schema=public

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm test
